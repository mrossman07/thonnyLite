[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thonnylite"
version = "0.1.0"
description = "Minimalist upload + console tool for MicroPython on Raspberry Pi Pico"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
thonnylite = "thonnylite.cli:main"

[tool.setuptools]
packages = ["thonnylite"]
